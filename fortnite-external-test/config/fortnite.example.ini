; Fortnite external test config template.
; NO OFFSETS, NO SIGNATURES, NO POINTER CHAINS ARE PROVIDED HERE.
; Supply values from evidence for the exact build you are testing.
; Pattern format: hex bytes with ?? or ? for wildcards, space-separated.
; Example format only (do not treat as a Fortnite signature): 48 8B 05 ?? ?? ?? ?? 48 85 C0

[process]
; Preferred target process name (can be overridden by --process)
name=FortniteClient-Win64-Shipping.exe

[pattern.GWorld]
module=FortniteClient-Win64-Shipping.exe
pattern=SUPPLY_FOR_YOUR_BUILD
; Optional: rip_relative=1 to resolve x64 RIP-relative disp32 at disp_offset
rip_relative=0
disp_offset=0
add_offset=0

[pattern.GameInstance]
module=FortniteClient-Win64-Shipping.exe
pattern=SUPPLY_FOR_YOUR_BUILD
rip_relative=0
disp_offset=0
add_offset=0
